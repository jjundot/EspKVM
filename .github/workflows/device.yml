name: ESP32-S3 provisioning firmware
on: [push, pull_request]
jobs:
  device:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2.3
          target: esp32s3
          command: |
            python -m venv out/tools/proto
            out/tools/proto/bin/python -m pip install -r tools/requirements-proto.txt
            mkdir -p out/deps
            git clone --depth 1 --branch 0.4.9.1 https://github.com/nanopb/nanopb.git out/deps/nanopb
            test "$(git -C out/deps/nanopb rev-parse HEAD)" = cad3c18ef15a663e30e3e43e3a752b66378adec1
            export PATH="$PWD/out/tools/proto/bin:$PATH"
            cmake -S . -B out/build/device -G Ninja -DBUILD_HOST=OFF -DBUILD_DEVICE=ON -DPython3_EXECUTABLE="$PWD/out/tools/proto/bin/python"
            cmake --build out/build/device --target package-device test-protocol
